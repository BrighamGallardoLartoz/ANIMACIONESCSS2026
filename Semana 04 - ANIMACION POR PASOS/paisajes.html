<html>
<head>
<title>TURISMO PERÚ</title>
<style>
*{
    padding:0px;
    margin:0px;
}
.contenedor{
    width: 1000px;
    height:300px;
    border:1px solid black;
    margin:0 auto;
    position: relative;
    overflow: hidden;
}
.tarjeta2, .tarjeta4{
    width:200px;
    height:300px;
    position: absolute;
    top:-300px;
    background-size: cover;
}

.tarjeta3{
    width:200px;
    height:300px;
    position: absolute;
    top:-300px;
    background-size: cover;
}

.tarjeta1{
    background-image: url(img/1.jpg);
    width:200px;
    height:300px;
    position: absolute;
    left:-200px;
    background-size: cover;
    animation: tarjeta1 3s 1 forwards;
}
.tarjeta2{
    background-image: url(img/2.webp);
    left:200px;
    animation:tarjeta2 3s 1 forwards 3s;
}
.tarjeta3{
    background-image: url(img/3.jpg);
    left:400px;
    animation: tarjeta3 3s 1 forwards 6s;
}
.tarjeta4{
    background-image: url(img/4.jpg);
    left:600px;
    animation: tarjeta4 3s 1 forwards 3s;
}
.tarjeta5{
    background-image: url(img/5.jpg);
    left:800px;
    width:200px;
    height:300px;
    position: absolute;
    background-size: cover;
    animation: tarjeta5 3s 1 forwards;
}

/*LAS RICAS ANIMACIONES*/
@keyframes tarjeta1{
    0%{
        left:-200px;
        transform: rotateY(180deg);
    }
    50%{
        left:200px;
    }
    100%{
        left:0px;
    }
}
@keyframes tarjeta2{
    0%{
        top:-300px;
        transform: rotateY(180deg);
    }
    50%{
        top:300px;
    }
    100%{
        top:0px;
    }
}
@keyframes tarjeta3{
    0%{
        top:-300px;
        transform: rotateY(180deg);
    }
    50%{
        top:300px;
    }
    100%{
        top:0px;
    }
}
@keyframes tarjeta4{
    0%{
        top:-300px;
        transform: rotateY(180deg);
    }
    50%{
        top:300px;
    }
    100%{
        top:0px;
    }
}
@keyframes tarjeta5{
    0%{
        right:-200px;
        transform: rotateY(180deg);
    }
    50%{
        right:300px;
    }
    100%{
        top:0px;
    }
}

/*EVENTOS*/
.tarjeta1:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta2:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta3:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta4:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta5:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
</style>
</head>
<body>
<div class="contenedor">
    <div class="tarjeta1"></div>
    <div class="tarjeta2"></div>
    <div class="tarjeta3"></div>
    <div class="tarjeta4"></div>
    <div class="tarjeta5"></div>
</div>    
</body>

</html>
